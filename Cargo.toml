[workspace]
members = [".", "migrations"]

[workspace.package]
name = "financial-management"
authors = ["Santiago Torres"]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = "0.7.7"
serde = { version = "1.0.124", features = ["derive"] }
serde_json = "1.0.64"
tokio = { version = "1.41.0", features = ["full"] }
opentelemetry = "0.27.0"
opentelemetry_sdk = { version = "0.27.0", features = ["rt-tokio"] }
opentelemetry-otlp = "0.27.0"
tonic = "0.12.3"
tracing-opentelemetry = "0.28.0"
tracing-subscriber = "0.3.18"
tower-http = { version = "0.6.1", features = ["trace"] }
log = "0.4.22"
opentelemetry-stdout = "0.27.0"
opentelemetry-appender-log = "0.27.0"
tracing = "0.1.40"
bytes = "1.9.0"
refinery = {version="0.8.12", features=["tokio-postgres"]}
tokio-postgres = {version="0.7.10", features=["with-chrono-0_4", "with-uuid-1"]}
bb8-postgres = "0.8.1"
futures = "0.3.31"

[package]
name = "financial-management"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
axum = {workspace=true}
serde = {workspace=true}
serde_json = {workspace=true}
tokio = {workspace=true}
opentelemetry = {workspace=true}
opentelemetry_sdk = {workspace=true}
opentelemetry-otlp = {workspace=true}
tonic = {workspace=true}
tracing-opentelemetry = {workspace=true}
tracing-subscriber = {workspace=true}
tower-http = {workspace=true}
log = {workspace=true}
opentelemetry-stdout = {workspace=true}
opentelemetry-appender-log = {workspace=true}
tracing = {workspace=true}
bytes = {workspace=true}
tokio-postgres = {workspace=true}
bb8-postgres = {workspace=true}
futures = {workspace=true}

[features]
local = []
